<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="X Feed Filter logo">
  <title>X Feed Filter</title>
  <defs>
    <linearGradient id="xff-bg" x1="64" y1="6" x2="64" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#252a33"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="xff-signal" x1="64" y1="26" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a33"/>
      <stop offset="1" stop-color="#e85d04"/>
    </linearGradient>
    <radialGradient id="xff-glow" cx="0.5" cy="0.16" r="0.9" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#xff-bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#xff-glow)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="27.25" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Feed rows narrowing into a filter funnel, resolving to one signal result -->
  <g fill="url(#xff-signal)">
    <rect x="26" y="30" width="76" height="13" rx="6.5"/>
    <rect x="38" y="54" width="52" height="13" rx="6.5"/>
    <rect x="50" y="78" width="28" height="13" rx="6.5"/>
    <circle cx="64" cy="104" r="8"/>
  </g>
</svg>
